name: Snake game

on:
  schedule:
    - cron: "0 */12 * * *" # Runs every 12 hours
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Generates the snake SVGs and GIF
      - name: generate-snake-game-from-github-contribution-grid
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            # Light Mode: Cream background, red snake, greyscale dots
            dist/github-snake.svg?color_snake=#e3342f&color_dots=#f3f4f6,#9ca3af,#6b7280,#374151,#111827
            
            # Dark Mode: Dark charcoal background, orange-red snake
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff4500&color_dots=#161b22,#e3342f,#bd1e1e,#8b0000,#450000

      # Push the files in 'dist' to the 'output' branch
      - name: push github-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
